name: ซู-ปืนครก (MortarHUD) build

# Builds the Windows HUD in MortarHUD/, runs its tests and self-test on a real
# Windows runner, and publishes a ready-to-run portable .exe as a GitHub Release
# named after the version in MortarHUD/Directory.Build.props (V0.1 -> sumortar-v0.1.0).

on:
  push:
    paths:
      - 'MortarHUD/**'
      - 'data/weapons.json'
      - '.github/workflows/sumortar.yml'
  pull_request:
    paths:
      - 'MortarHUD/**'
      - 'data/weapons.json'
      - '.github/workflows/sumortar.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sumortar-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # WPF + Win32 interop: tests, self-test and OCR native libraries need Windows.
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: write
    defaults:
      run:
        shell: pwsh
        working-directory: MortarHUD

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up .NET 10
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          dotnet-version: '10.0.x'

      - name: Cache NuGet packages
        uses: actions/cache@2c8a9bd7457de244a408f35966fab2fb45fda9c8 # v6.0.0
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-sumortar-nuget-${{ hashFiles('MortarHUD/**/*.csproj', 'MortarHUD/Directory.Build.props', 'MortarHUD/global.json') }}
          restore-keys: ${{ runner.os }}-sumortar-nuget-

      - name: Read version
        run: |
          [xml]$props = Get-Content -LiteralPath Directory.Build.props -Raw
          $version = ($props.Project.PropertyGroup | Where-Object { $_.Version } | Select-Object -First 1).Version
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw "Unexpected version: $version" }
          $parts = $version.Split('.')
          $display = "V$($parts[0]).$($parts[1])"
          "APP_VERSION=$version" >> $env:GITHUB_ENV
          "APP_DISPLAY_VERSION=$display" >> $env:GITHUB_ENV
          "PACKAGE_NAME=SuMortar-$display-win-x64" >> $env:GITHUB_ENV
          "RELEASE_TAG=sumortar-v$version" >> $env:GITHUB_ENV

      - name: Build
        run: dotnet build MortarHUD.sln -c Release --nologo

      - name: Test
        run: dotnet test MortarHUD.sln -c Release --no-build --nologo

      - name: Self-test (debug build)
        timeout-minutes: 3
        run: |
          $process = Start-Process -FilePath ./src/MortarHUD.App/bin/Release/net10.0-windows/MortarHUD.exe -ArgumentList '--selftest' -Wait -PassThru -WindowStyle Hidden
          if ($process.ExitCode -ne 0) { throw "Self-test failed: $($process.ExitCode)" }

      - name: Publish portable single-file exe
        run: |
          ./tools/publish.ps1 -Mode portable -OutputDirectory "dist/$env:PACKAGE_NAME" -DotnetPath (Get-Command dotnet).Source
          # The program's file name is ซู-ปืนครก.exe. Renaming a single-file bundle is safe:
          # the apphost finds its payload inside itself, not by file name.
          $exeName = -join ([char[]](0x0E0B, 0x0E39, 0x002D, 0x0E1B, 0x0E37, 0x0E19, 0x0E04, 0x0E23, 0x0E01)) + '.exe'
          Rename-Item -LiteralPath "dist/$env:PACKAGE_NAME/MortarHUD.exe" -NewName $exeName
          "EXE_NAME=$exeName" >> $env:GITHUB_ENV

      - name: Self-test the portable exe from another working directory
        timeout-minutes: 3
        run: |
          $exe = (Resolve-Path -LiteralPath "dist/$env:PACKAGE_NAME/$env:EXE_NAME").Path
          $fileVersion = (Get-Item -LiteralPath $exe).VersionInfo.FileVersion
          if ($fileVersion -ne "$env:APP_VERSION.0") { throw "Wrong exe version: $fileVersion" }
          $process = Start-Process -FilePath $exe -ArgumentList '--selftest' -WorkingDirectory $env:RUNNER_TEMP -Wait -PassThru -WindowStyle Hidden
          if ($process.ExitCode -ne 0) { throw "Portable self-test failed: $($process.ExitCode)" }
          # Make sure native Tesseract OCR loaded (a silent fallback to the template engine
          # would ship a build that cannot read the digits 2 and 3).
          $log = Get-ChildItem -LiteralPath "$env:APPDATA/SuMortar/Logs" -Filter '*.log' | Sort-Object LastWriteTime | Select-Object -Last 1
          if (-not $log -or -not (Select-String -LiteralPath $log.FullName -SimpleMatch 'Tesseract+Tesseract')) {
            throw 'Portable build did not load Tesseract OCR'
          }

      - name: Package
        run: |
          Copy-Item -LiteralPath LICENSE -Destination "dist/$env:PACKAGE_NAME/LICENSE"
          Copy-Item -LiteralPath NOTICE -Destination "dist/$env:PACKAGE_NAME/NOTICE"
          Copy-Item -LiteralPath docs/sumortar/README-th.txt -Destination "dist/$env:PACKAGE_NAME/README-th.txt"
          Compress-Archive -Path "dist/$env:PACKAGE_NAME/*" -DestinationPath "dist/$env:PACKAGE_NAME.zip"
          $hash = (Get-FileHash -LiteralPath "dist/$env:PACKAGE_NAME.zip" -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $env:PACKAGE_NAME.zip" | Set-Content -LiteralPath dist/SHA256SUMS.txt -Encoding utf8NoBOM
          "Commit: $env:GITHUB_SHA`n`nSHA-256: $hash" >> $env:GITHUB_STEP_SUMMARY

      - name: Upload build artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ env.PACKAGE_NAME }}
          path: |
            MortarHUD/dist/${{ env.PACKAGE_NAME }}.zip
            MortarHUD/dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

      # Every pushed version gets its own release (V0.1, V0.2, ...). Re-running the
      # same version replaces that release's assets; pull requests never publish.
      - name: Publish GitHub Release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $title = "$([char]0x0E0B)$([char]0x0E39)-$([char]0x0E1B)$([char]0x0E37)$([char]0x0E19)$([char]0x0E04)$([char]0x0E23)$([char]0x0E01) $env:APP_DISPLAY_VERSION"
          $notes = Get-Content -LiteralPath docs/sumortar/release-notes.md -Raw -Encoding utf8
          $notes = $notes + "`n`nCommit: $env:GITHUB_SHA"
          $notesFile = Join-Path $env:RUNNER_TEMP 'notes.md'
          Set-Content -LiteralPath $notesFile -Value $notes -Encoding utf8NoBOM

          gh release view $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title $title --notes-file $notesFile --prerelease
            if ($LASTEXITCODE -ne 0) { throw 'Failed to create the release' }
          } else {
            gh release edit $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY --title $title --notes-file $notesFile
            if ($LASTEXITCODE -ne 0) { throw 'Failed to update the release' }
          }
          gh release upload $env:RELEASE_TAG "dist/$env:PACKAGE_NAME.zip" dist/SHA256SUMS.txt --repo $env:GITHUB_REPOSITORY --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Failed to upload release assets' }
